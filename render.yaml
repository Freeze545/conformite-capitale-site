# Conformité Capitale — site statique (Vite, dossier dist)
# Schéma : https://render.com/schema/render.yaml.json
services:
  - type: web
    name: conformite-capitale
    runtime: static
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    previews:
      generation: automatic
    routes:
      - type: redirect
        source: /services
        destination: /services/
      - type: redirect
        source: /a-propos
        destination: /a-propos/
      - type: redirect
        source: /contact
        destination: /contact/
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
